name: build-eth-dex
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: setup android sdk
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          cd $HOME/android-sdk
          yes | latest/bin/sdkmanager --licenses
          latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: compile
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          AJ=$ANDROID_HOME/platforms/android-34/android.jar
          D8=$ANDROID_HOME/build-tools/34.0.0/d8
          echo "AJ=$AJ"
          echo "D8=$D8"
          ls "$AJ" 2>&1
          mkdir -p out
          javac -source 8 -target 8 -bootclasspath "$AJ" -cp "$AJ" -d out src/com/ethtether/EthTether.java 2>&1
          echo "--- javac done ---"
          "$D8" --min-api 24 --output . out/com/ethtether/EthTether.class --lib "$AJ" 2>&1
          echo "--- d8 done ---"
          ls -la classes.dex 2>&1

      - uses: actions/upload-artifact@v7
        with:
          name: eth-tether-dex
          path: classes.dex
