name: build-eth-dex
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: compile
        run: |
          AJ=$ANDROID_HOME/platforms/android-34/android.jar
          mkdir -p out
          javac -source 8 -target 8 -bootclasspath "$AJ" -cp "$AJ" -d out src/com/ethtether/EthTether.java
          $ANDROID_HOME/build-tools/34.0.0/d8 --min-api 24 --output . out/com/ethtether/EthTether.class --lib "$AJ"
      - uses: actions/upload-artifact@v4
        with:
          name: eth-tether-dex
          path: classes.dex
