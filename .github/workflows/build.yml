name: build-eth-dex
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: download android tools
        run: |
          curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/tools.zip
          mkdir -p $HOME/sdk/cmdline-tools
          unzip -qo /tmp/tools.zip -d $HOME/sdk/cmdline-tools
          mv $HOME/sdk/cmdline-tools/cmdline-tools $HOME/sdk/cmdline-tools/latest

      - name: install platform
        run: |
          export ANDROID_HOME=$HOME/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: compile
        run: |
          export ANDROID_HOME=$HOME/sdk
          export PATH=$JAVA_HOME/bin:$PATH
          AJ=$ANDROID_HOME/platforms/android-34/android.jar
          echo "javac: $(which javac)"
          echo "AJ exists: $(ls $AJ 2>&1)"
          mkdir -p out
          javac -source 8 -target 8 -bootclasspath "$AJ" -cp "$AJ" -d out src/com/ethtether/EthTether.java
          echo "javac exit: $?"
          $ANDROID_HOME/build-tools/34.0.0/d8 --min-api 24 --output . out/com/ethtether/EthTether.class --lib "$AJ"
          echo "d8 exit: $?"
          ls -la classes.dex

      - uses: actions/upload-artifact@v7
        with:
          name: eth-tether-dex
          path: classes.dex
